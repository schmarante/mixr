# Tests, builds the static site (BUILD_TARGET=static → dist/) and deploys it to GitHub Pages:
# https://schmarante.github.io/strudelmixr/
#
# The app itself runs with SSR (ddev / Node server); GitHub Pages only serves static files, so this
# workflow builds the static variant: same app, language picked by the browser instead of the server.
name: Deploy to GitHub Pages

on:
  # every push to master
  push:
    branches: ["master"]

  # manual run from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN may deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; queued runs in between are skipped, a running one is not cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the app version counts the commits (astro.config.mjs)

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # generated Strudel code is checked against real Strudel, types against TypeScript strictest
      - name: Test
        run: npm test

      - name: Type check
        run: npm run check

      # project page lives in a sub directory (/strudelmixr/): base path and public URL come from the Pages
      # settings (base_path "/strudelmixr", base_url "https://schmarante.github.io/strudelmixr") – astro.config.mjs
      # reads both. Repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables)
      # overrides the URL, e.g. for a custom domain.
      - name: Build
        run: npm run build
        env:
          BUILD_TARGET: static
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
